name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the checksum-pinned scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan reachable history and the checked-out tree
        run: |
          # Keep PR-controlled config, fingerprint exclusions and inline allow
          # comments from silently removing findings from the required gate.
          # Gitleaks also reads source/.gitleaksignore beside the explicit file.
          if [ -e .gitleaksignore ] || [ -L .gitleaksignore ]; then
            echo 'Repository fingerprint exclusions are not permitted in the required secret scan.'
            exit 1
          fi
          scanner_config="$RUNNER_TEMP/gitleaks-defaults.toml"
          scanner_ignore="$RUNNER_TEMP/gitleaks-empty.ignore"
          cat > "$scanner_config" <<'TOML'
          [extend]
          useDefault = true
          TOML
          : > "$scanner_ignore"
          /tmp/gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow \
            --config "$scanner_config" --gitleaks-ignore-path "$scanner_ignore" \
            --log-opts='--all --full-history' .
          /tmp/gitleaks dir --redact=100 --no-banner --ignore-gitleaks-allow \
            --config "$scanner_config" --gitleaks-ignore-path "$scanner_ignore" .
